
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Pharmacy Management System</h1>
        <p>Stock Management and Medicine Sales Analysis</p>
    </header>

    <nav>
        <a href="#dashboard">Dashboard</a>
        <a href="#medicines">Medicines</a>
        <a href="#addMedicine">Add Medicine</a>
    </nav>

    <main>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div class="cards">
                <div class="card">
                    <h3>Total Medicines</h3>
                    <p id="totalMedicines">0</p>
                </div>
                <div class="card">
                    <h3>Total Stock</h3>
                    <p id="totalStock">0</p>
                </div>
                <div class="card">
                    <h3>Low Stock Items</h3>
                    <p id="lowStock">0</p>
                </div>
            </div>
        </section>

        <section id="addMedicine">
            <h2>Add Medicine</h2>

            <form id="medicineForm">
                <input type="text" id="medicineName"
                    placeholder="Medicine Name" required>

                <input type="text" id="category"
                    placeholder="Category" required>

                <input type="text" id="manufacturer"
                    placeholder="Manufacturer" required>

                <input type="number" id="price"
                    placeholder="Unit Price" min="0.01" step="0.01" required>

                <input type="number" id="quantity"
                    placeholder="Quantity" min="0" required>

                <input type="date" id="expiryDate" required>

                <button type="submit">Add Medicine</button>
            </form>
        </section>

        <section id="medicines">
            <h2>Medicine Details</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Manufacturer</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Expiry Date</th>
                        </tr>
                    </thead>
                    <tbody id="medicineTable">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Pharmacy Stock Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
